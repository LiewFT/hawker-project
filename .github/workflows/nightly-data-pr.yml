name: Sync stall data from Sheet

# Nightly: pulls new Form responses out of the linked Sheet, regenerates
# data/venues/<slug>.json for whichever venues have new rows, and opens a
# PR with the diff for a teammate to review -- never pushes straight to
# main. See pipeline/SETUP.md for the one-time Google Cloud + secrets
# setup this needs before it can run for real.
on:
  schedule:
    - cron: '0 18 * * *' # 02:00 SGT
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in `if:` directly, so record whether both exist.
      SHEET_CONNECTED: ${{ secrets.SHEET_ID != '' && secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}
    steps:
      # Until the Sheet is connected, skip quietly instead of failing every night.
      - if: env.SHEET_CONNECTED != 'true'
        run: echo "::notice::No Sheet connected yet (SHEET_ID / GOOGLE_SERVICE_ACCOUNT_KEY secrets missing), so there is nothing to sync. See pipeline/SETUP.md."
      - if: env.SHEET_CONNECTED == 'true'
        uses: actions/checkout@v4
      - if: env.SHEET_CONNECTED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: env.SHEET_CONNECTED == 'true'
        run: npm ci
      - if: env.SHEET_CONNECTED == 'true'
        run: node scripts/sync-sheet-to-json.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
      - if: env.SHEET_CONNECTED == 'true'
        run: npm run validate-data
      - if: env.SHEET_CONNECTED == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Sync stall data from Form responses'
          title: 'Nightly stall data sync'
          body: |
            Automated sync from the stall collection Form/Sheet.

            Review before merging -- this PR is not auto-merged. Check
            that `npm run validate-data` (already run in this workflow)
            passed and that nothing looks obviously wrong before approving.
          branch: nightly-data-sync
          delete-branch: true
